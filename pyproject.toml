[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-react-rag-agent"
version = "0.1.0"
description = "ReAct agent with FAISS retrieval and a behavioural test suite, built on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
